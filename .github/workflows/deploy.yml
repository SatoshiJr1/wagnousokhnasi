name: Deploy wagnousokhnasi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_PATH: /srv/projects/wagnousokhnasi

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          frontend:
            - 'frontend/**'
          backend:
            - 'backend/**'
          config:
            - 'docker-compose.yml'

    - name: Create deployment package
      run: |
        mkdir -p temp-deploy
        cp docker-compose.yml temp-deploy/

        if [[ "${{ steps.filter.outputs.frontend }}" == 'true' ]]; then
          echo "Including frontend..."
          rsync -av --exclude=node_modules --exclude=.git ./frontend temp-deploy/
        fi

        if [[ "${{ steps.filter.outputs.backend }}" == 'true' ]]; then
          echo "Including backend..."
          rsync -av --exclude=node_modules --exclude=.git ./backend temp-deploy/
        fi

        cd temp-deploy
        tar -czf ../deploy-package.tar.gz .
        cd ..
        rm -rf temp-deploy

    - name: Upload to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "deploy-package.tar.gz"
        target: "/tmp/"

    - name: Deploy on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          cd ${{ env.PROJECT_PATH }}

          # Create temp directory for extraction
          mkdir -p temp_extract
          tar -xzf /tmp/deploy-package.tar.gz -C temp_extract

          # Always update docker-compose
          mv temp_extract/docker-compose.yml .

          # Update Frontend if present
          if [ -d "temp_extract/frontend" ]; then
            echo "Updating Frontend..."
            rm -rf frontend
            mv temp_extract/frontend .
            docker compose up -d --build wagnousokhnasi-frontend
          fi

          # Update Backend if present
          if [ -d "temp_extract/backend" ]; then
            echo "Updating Backend..."
            rm -rf backend
            mv temp_extract/backend .
            docker compose up -d --build wagnousokhnasi-backend

            # Wait for backend to be ready then migrate
            echo "Waiting for backend to start..."
            sleep 10
            echo "Running migrations..."
            docker exec wagnousokhnasi-backend npm run migrate
          fi

          # Cleanup
          rm -rf temp_extract
          rm /tmp/deploy-package.tar.gz

          # Prune unused images to save space
          docker image prune -f
